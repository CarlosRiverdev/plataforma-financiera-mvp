<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#14202a"/>
    </marker>
    <marker id="flecha-roja" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a3321e"/>
    </marker>
  </defs>

  <rect width="1100" height="620" fill="#ffffff"/>

  <text x="24" y="34" font-size="19" font-weight="600" fill="#14202a">Diagrama de interacción — Calculadora de interés simple y compuesto</text>
  <text x="24" y="54" font-size="13" fill="#5a6872">Flujo entre el usuario, la interfaz, la validación, el cálculo y la salida visual</text>

  <!-- Carriles -->
  <g>
    <rect x="24"  y="72" width="199" height="520" fill="#f6f7f3" stroke="#d3d7cc" rx="4"/>
    <rect x="237" y="72" width="199" height="520" fill="#f6f7f3" stroke="#d3d7cc" rx="4"/>
    <rect x="450" y="72" width="199" height="520" fill="#f6f7f3" stroke="#d3d7cc" rx="4"/>
    <rect x="663" y="72" width="199" height="520" fill="#f6f7f3" stroke="#d3d7cc" rx="4"/>
    <rect x="876" y="72" width="199" height="520" fill="#f6f7f3" stroke="#d3d7cc" rx="4"/>

    <rect x="24"  y="72" width="199" height="40" fill="#14202a" rx="4"/>
    <rect x="237" y="72" width="199" height="40" fill="#14202a" rx="4"/>
    <rect x="450" y="72" width="199" height="40" fill="#14202a" rx="4"/>
    <rect x="663" y="72" width="199" height="40" fill="#14202a" rx="4"/>
    <rect x="876" y="72" width="199" height="40" fill="#14202a" rx="4"/>

    <text x="123.5" y="97" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="middle">Usuario</text>
    <text x="336.5" y="97" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="middle">Interfaz · HTML + CSS</text>
    <text x="549.5" y="97" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="middle">Validación · JS</text>
    <text x="762.5" y="97" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="middle">Cálculo · JS</text>
    <text x="975.5" y="97" font-size="13.5" font-weight="600" fill="#ffffff" text-anchor="middle">Salida · Chart.js + DOM</text>
  </g>

  <!-- USUARIO -->
  <rect x="40" y="210" width="167" height="86" fill="#ffffff" stroke="#14202a" stroke-width="1.4" rx="4"/>
  <text x="123.5" y="238" font-size="13" font-weight="600" fill="#14202a" text-anchor="middle">Ingresa los datos</text>
  <text x="123.5" y="258" font-size="12" fill="#5a6872" text-anchor="middle">Capital, tasa anual,</text>
  <text x="123.5" y="274" font-size="12" fill="#5a6872" text-anchor="middle">tiempo y capitalización</text>

  <rect x="40" y="330" width="167" height="62" fill="#ffffff" stroke="#14202a" stroke-width="1.4" rx="4"/>
  <text x="123.5" y="356" font-size="13" font-weight="600" fill="#14202a" text-anchor="middle">Pulsa Calcular</text>
  <text x="123.5" y="376" font-size="12" fill="#5a6872" text-anchor="middle">o cambia de pestaña</text>

  <!-- VENTANAS -->
  <rect x="253" y="150" width="167" height="66" fill="#ffffff" stroke="#2c5d8f" stroke-width="1.6" rx="4"/>
  <text x="336.5" y="176" font-size="12.5" font-weight="600" fill="#2c5d8f" text-anchor="middle">Ventana 1</text>
  <text x="336.5" y="196" font-size="12.5" fill="#14202a" text-anchor="middle">Interés simple</text>

  <rect x="253" y="245" width="167" height="66" fill="#ffffff" stroke="#17714a" stroke-width="1.6" rx="4"/>
  <text x="336.5" y="271" font-size="12.5" font-weight="600" fill="#17714a" text-anchor="middle">Ventana 2</text>
  <text x="336.5" y="291" font-size="12.5" fill="#14202a" text-anchor="middle">Interés compuesto</text>

  <rect x="253" y="340" width="167" height="66" fill="#ffffff" stroke="#14202a" stroke-width="1.6" rx="4"/>
  <text x="336.5" y="366" font-size="12.5" font-weight="600" fill="#14202a" text-anchor="middle">Ventana 3</text>
  <text x="336.5" y="386" font-size="12.5" fill="#14202a" text-anchor="middle">Comparación</text>

  <rect x="253" y="470" width="167" height="60" fill="#fdf6f4" stroke="#a3321e" stroke-width="1.4" rx="4"/>
  <text x="336.5" y="495" font-size="12.5" font-weight="600" fill="#a3321e" text-anchor="middle">Mensaje de error</text>
  <text x="336.5" y="513" font-size="11.5" fill="#a3321e" text-anchor="middle">visible bajo el campo</text>

  <!-- VALIDACIÓN -->
  <rect x="466" y="170" width="167" height="110" fill="#ffffff" stroke="#14202a" stroke-width="1.4" rx="4"/>
  <text x="549.5" y="196" font-size="12.5" font-weight="600" fill="#14202a" text-anchor="middle">leerCampo()</text>
  <text x="549.5" y="219" font-size="11.5" fill="#5a6872" text-anchor="middle">¿campo vacío?</text>
  <text x="549.5" y="237" font-size="11.5" fill="#5a6872" text-anchor="middle">¿no es un número?</text>
  <text x="549.5" y="255" font-size="11.5" fill="#5a6872" text-anchor="middle">¿fuera de rango?</text>
  <text x="549.5" y="273" font-size="11.5" fill="#5a6872" text-anchor="middle">¿años enteros?</text>

  <rect x="466" y="330" width="167" height="56" fill="#ffffff" stroke="#a3321e" stroke-width="1.4" rx="4"/>
  <text x="549.5" y="353" font-size="12.5" font-weight="600" fill="#a3321e" text-anchor="middle">Dato inválido</text>
  <text x="549.5" y="372" font-size="11.5" fill="#5a6872" text-anchor="middle">se corta el cálculo</text>

  <!-- CÁLCULO -->
  <rect x="679" y="150" width="167" height="72" fill="#ffffff" stroke="#2c5d8f" stroke-width="1.6" rx="4"/>
  <text x="762.5" y="176" font-size="12.5" font-weight="600" fill="#2c5d8f" text-anchor="middle">interesSimple()</text>
  <text x="762.5" y="200" font-size="13" fill="#14202a" text-anchor="middle" font-family="'IBM Plex Mono',monospace">A = P (1 + r·t)</text>

  <rect x="679" y="250" width="167" height="72" fill="#ffffff" stroke="#17714a" stroke-width="1.6" rx="4"/>
  <text x="762.5" y="276" font-size="12.5" font-weight="600" fill="#17714a" text-anchor="middle">interesCompuesto()</text>
  <text x="762.5" y="300" font-size="13" fill="#14202a" text-anchor="middle" font-family="'IBM Plex Mono',monospace">A = P (1 + r/n)^nt</text>

  <rect x="679" y="355" width="167" height="66" fill="#ffffff" stroke="#14202a" stroke-width="1.4" rx="4"/>
  <text x="762.5" y="381" font-size="12.5" font-weight="600" fill="#14202a" text-anchor="middle">Serie de datos</text>
  <text x="762.5" y="401" font-size="11.5" fill="#5a6872" text-anchor="middle">un valor por año (0 … t)</text>

  <!-- SALIDA -->
  <rect x="892" y="150" width="167" height="66" fill="#14202a" rx="4"/>
  <text x="975.5" y="176" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">Tarjeta de resultado</text>
  <text x="975.5" y="196" font-size="11.5" fill="#9fb0ba" text-anchor="middle">capital final e interés</text>

  <rect x="892" y="250" width="167" height="72" fill="#ffffff" stroke="#14202a" stroke-width="1.4" rx="4"/>
  <text x="975.5" y="276" font-size="12.5" font-weight="600" fill="#14202a" text-anchor="middle">Gráfica de líneas</text>
  <text x="975.5" y="296" font-size="11.5" fill="#5a6872" text-anchor="middle">new Chart(canvas, …)</text>

  <rect x="892" y="355" width="167" height="66" fill="#ffffff" stroke="#14202a" stroke-width="1.4" rx="4"/>
  <text x="975.5" y="381" font-size="12.5" font-weight="600" fill="#14202a" text-anchor="middle">Tabla de detalle</text>
  <text x="975.5" y="401" font-size="11.5" fill="#5a6872" text-anchor="middle">año por año</text>

  <!-- Flechas: usuario -> ventanas -->
  <path d="M207,253 L247,253" stroke="#14202a" stroke-width="1.6" fill="none" marker-end="url(#flecha)"/>
  <path d="M207,361 L227,361 L227,420 L247,420" stroke="#14202a" stroke-width="1.6" fill="none" marker-end="url(#flecha)"/>
  <text x="215" y="245" font-size="11" fill="#5a6872">entrada</text>

  <!-- Ventanas -> validación -->
  <path d="M420,183 L443,183 L443,195 L460,195" stroke="#14202a" stroke-width="1.4" fill="none" marker-end="url(#flecha)"/>
  <path d="M420,278 L443,278 L443,225 L460,225" stroke="#14202a" stroke-width="1.4" fill="none" marker-end="url(#flecha)"/>
  <path d="M420,373 L443,373 L443,255 L460,255" stroke="#14202a" stroke-width="1.4" fill="none" marker-end="url(#flecha)"/>
  <text x="428" y="148" font-size="11" fill="#5a6872">submit</text>

  <!-- Validación -> error -> ventana -->
  <path d="M549.5,280 L549.5,330" stroke="#a3321e" stroke-width="1.4" fill="none" marker-end="url(#flecha-roja)"/>
  <path d="M466,358 L443,358 L443,500 L420,500" stroke="#a3321e" stroke-width="1.4" fill="none" marker-end="url(#flecha-roja)"/>
  <text x="556" y="310" font-size="11" fill="#a3321e">no</text>

  <!-- Validación -> cálculo -->
  <path d="M633,195 L656,195 L656,186 L676,186" stroke="#14202a" stroke-width="1.4" fill="none" marker-end="url(#flecha)"/>
  <path d="M633,235 L656,235 L656,286 L676,286" stroke="#14202a" stroke-width="1.4" fill="none" marker-end="url(#flecha)"/>
  <text x="640" y="168" font-size="11" fill="#5a6872">datos válidos</text>

  <!-- Cálculo -> serie -->
  <path d="M762.5,222 L762.5,240 L700,240 L700,352" stroke="#14202a" stroke-width="1.4" fill="none" marker-end="url(#flecha)"/>
  <path d="M762.5,322 L762.5,352" stroke="#14202a" stroke-width="1.4" fill="none" marker-end="url(#flecha)"/>

  <!-- Cálculo -> salida -->
  <path d="M846,178 L869,178 L869,183 L889,183" stroke="#14202a" stroke-width="1.4" fill="none" marker-end="url(#flecha)"/>
  <path d="M846,388 L869,388 L869,286 L889,286" stroke="#14202a" stroke-width="1.4" fill="none" marker-end="url(#flecha)"/>
  <path d="M846,400 L869,400 L869,388 L889,388" stroke="#14202a" stroke-width="1.4" fill="none" marker-end="url(#flecha)"/>
  <text x="852" y="262" font-size="11" fill="#5a6872">render</text>

  <!-- Retorno al usuario -->
  <path d="M975.5,421 L975.5,560 L123.5,560 L123.5,396" stroke="#14202a" stroke-width="1.4" fill="none" stroke-dasharray="5 4" marker-end="url(#flecha)"/>
  <text x="540" y="553" font-size="11.5" fill="#5a6872" text-anchor="middle">El usuario lee el resultado y puede cambiar los datos o pasar a otra ventana</text>
</svg>
